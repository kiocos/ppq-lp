<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PPQ — oito usos de animação</title>
<style>
:root{color-scheme:dark;--ink:var(--foreground,#ededeb);--dim:var(--muted-foreground,#999);--base:var(--background,#101010);--panel:var(--card,#1b1b1b);--line:color-mix(in srgb,var(--foreground,#eee) 22%,var(--background,#111));--warm:var(--warning,#c66a36);--radius:10px}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;color:var(--ink);font-family:var(--font-sans,Arial,sans-serif)}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--ink);outline-offset:4px}.options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.option{border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--dim);padding:12px;text-align:left;min-height:76px;font-size:12px;line-height:1.4}.option small{display:block;font:9px var(--font-mono,monospace);margin-bottom:7px}.option[aria-selected=true]{background:var(--ink);color:var(--base);border-color:var(--ink)}.study{margin-top:16px;padding:16px;border-radius:var(--radius);background:var(--panel)}.topline{display:flex;justify-content:space-between;align-items:center;gap:15px}.place{font:10px/1.5 var(--font-mono,monospace);letter-spacing:.04em;color:var(--dim);text-transform:uppercase}#pause{border:1px solid var(--line);border-radius:5px;background:transparent;color:var(--dim);padding:7px 10px;font-size:11px}.scene{height:268px;display:grid;place-items:center;overflow:hidden;margin:8px 0 16px;border-bottom:1px solid var(--line)}.scene svg{width:100%;height:250px;max-width:650px;color:var(--ink);overflow:visible}.scene svg text{font-family:var(--font-mono,monospace);font-size:11px;fill:var(--dim);stroke:none}.scene .strong{fill:var(--ink)}.scene .line{stroke:var(--line);fill:none;stroke-width:1}.scene .surface{fill:var(--base);stroke:var(--line);stroke-width:1}.scene .ink{stroke:var(--ink);fill:none;stroke-width:1}.scene .warm{stroke:var(--warm);fill:none;stroke-width:1.5}.scene .fill-warm{fill:var(--warm);stroke:none}.scene .dim-fill{fill:var(--line);stroke:none}.scene .pill{fill:var(--panel);stroke:var(--line)}.description{display:grid;grid-template-columns:1fr 1fr;gap:28px}h2{font-size:24px;line-height:1.15;letter-spacing:-.035em;font-weight:550;margin:0 0 13px;text-wrap:balance}.description p{font-size:13px;line-height:1.65;color:var(--dim);margin:0}.description strong{display:block;color:var(--ink);font-size:12px;font-weight:550;margin:0 0 7px}.behavior{margin-top:16px!important}.footnote{font:10px/1.6 var(--font-mono,monospace);color:var(--dim);margin:14px 0 0}.source{font-size:11px;color:var(--dim);line-height:1.6;margin-top:7px}.source a{color:inherit;text-underline-offset:3px}.scene .reveal-mask{animation:reveal 8s ease-in-out infinite}.scene .reveal-edge{animation:revealEdge 8s ease-in-out infinite}.scene .material-line{animation:material 7s ease-in-out infinite}.scene .material-line.delay{animation-delay:-2.3s}.scene .material-line.delay2{animation-delay:-4.6s}.scene .float-one{animation:floatA 8s ease-in-out infinite alternate}.scene .float-two{animation:floatB 10s ease-in-out infinite alternate}.scene .float-three{animation:floatA 9s ease-in-out -3s infinite alternate}.scene .verify-beam{animation:verify 9s ease-in-out infinite}.scene .packet-a{animation:routeA 7s ease-in-out infinite}.scene .packet-b{animation:routeB 7s ease-in-out -2.3s infinite}.scene .packet-c{animation:routeC 7s ease-in-out -4.6s infinite}.scene .job-light{animation:job 9s ease-in-out infinite}.scene .job-light.second{animation-delay:-6s}.scene .job-light.third{animation-delay:-3s}.scene .seam-light{animation:seam 7s ease-in-out infinite}.scene .brand-fill{animation:brand 9s ease-in-out infinite}.scene .brand-outline{animation:outline 9s ease-in-out infinite;stroke-dasharray:280;stroke-dashoffset:280}.paused .scene *{animation-play-state:paused!important}@keyframes reveal{0%,12%{transform:translateX(0)}42%,78%{transform:translateX(400px)}95%,100%{transform:translateX(0)}}@keyframes revealEdge{0%,12%{transform:translateX(0);opacity:0}18%{opacity:1}42%,78%{transform:translateX(400px);opacity:0}100%{transform:translateX(0);opacity:0}}@keyframes material{0%,100%{transform:translateY(0);opacity:.2}50%{transform:translateY(95px);opacity:.9}}@keyframes floatA{from{transform:translateY(-6px)}to{transform:translateY(10px)}}@keyframes floatB{from{transform:translateY(7px)}to{transform:translateY(-9px)}}@keyframes verify{0%,10%{transform:translateX(0);opacity:0}18%{opacity:1}80%{transform:translateX(430px);opacity:1}90%,100%{transform:translateX(430px);opacity:0}}@keyframes routeA{0%,15%{transform:translate(0,0);opacity:0}20%{opacity:1}68%{transform:translate(0,-58px);opacity:1}85%,100%{transform:translate(120px,-58px);opacity:0}}@keyframes routeB{0%,15%{transform:translate(0,0);opacity:0}20%{opacity:1}85%,100%{transform:translate(120px,0);opacity:0}}@keyframes routeC{0%,15%{transform:translate(0,0);opacity:0}20%{opacity:1}68%{transform:translate(0,58px);opacity:1}85%,100%{transform:translate(120px,58px);opacity:0}}@keyframes job{0%,7%{opacity:0}12%,24%{opacity:1}32%,100%{opacity:0}}@keyframes seam{0%,10%{transform:translateX(-150px);opacity:0}25%{opacity:1}70%{transform:translateX(440px);opacity:1}88%,100%{transform:translateX(570px);opacity:0}}@keyframes brand{0%,35%{opacity:0}55%,85%{opacity:1}100%{opacity:0}}@keyframes outline{0%,10%{stroke-dashoffset:280;opacity:.2}48%,85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@media(max-width:560px){.options{grid-template-columns:repeat(2,minmax(0,1fr))}.option{min-height:65px;padding:10px}.description{grid-template-columns:1fr;gap:18px}.scene{height:210px}.scene svg{height:200px}h2{font-size:23px}.study{padding:16px}.description p{font-size:12px}}@media(prefers-reduced-motion:reduce){.scene *{animation:none!important}.scene .reveal-mask{transform:translateX(400px)}.scene .reveal-edge{display:none}.scene .brand-outline{stroke-dashoffset:0}}
</style></head><body>
<div class="options" role="tablist" aria-label="Ideias de aplicação" id="options"></div>
<section class="study" id="study" role="tabpanel"><div class="topline"><span class="place" id="place"></span><button id="pause">Pausar esboço</button></div><div class="scene" id="scene" aria-hidden="true"></div><div class="description"><div><h2 id="title"></h2><p id="description"></p></div><div><strong>Movimento sugerido</strong><p id="motion"></p><p class="behavior"><strong>O papel na página</strong><span id="purpose"></span></p></div></div></section>
<p class="footnote">Esboços conceituais em SVG/CSS. As cenas finais seriam produzidas no Unicorn Studio, com materiais, iluminação e timing próprios.</p>
<p class="source">Viabilidade: <a href="https://www.unicorn.studio/docs/events/" target="_blank" rel="noopener noreferrer">entrada, scroll, hover e mouse</a> · <a href="https://www.unicorn.studio/docs/" target="_blank" rel="noopener noreferrer">imagens, formas, texto e 3D</a></p>
<script>
const wrap=content=>'<svg viewBox="0 0 560 240" xmlns="http://www.w3.org/2000/svg">'+content+'</svg>';
const skeleton=(x,y,w)=>'<rect class="dim-fill" x="'+x+'" y="'+y+'" width="'+w+'" height="4" rx="2"/>';
const options=[
{name:'Revelar o produto',place:'01 · Hero / entrada da demo',title:'Uma abertura que apresenta a interface',description:'Uma superfície escura se afasta e revela a tela da PPQ. O efeito cria um momento de apresentação para um screenshot muito bem composto.',motion:'Uma passagem de luz acompanha a revelação. Na landing, acontece uma vez quando o produto entra na tela; depois, a interface fica estável.',purpose:'Direcionar a atenção para o produto e dar valor à primeira demonstração.',svg:wrap('<defs><clipPath id="screen-clip"><rect x="80" y="30" width="400" height="180" rx="8"/></clipPath></defs><rect class="surface" x="80" y="30" width="400" height="180" rx="8"/><path class="line" d="M80 58H480M150 58V210"/><text x="95" y="48">PPQ</text>'+skeleton(95,80,38)+skeleton(95,93,26)+skeleton(175,85,220)+skeleton(175,98,180)+skeleton(175,111,195)+'<rect class="line" x="175" y="159" width="278" height="29" rx="4"/><g clip-path="url(#screen-clip)"><rect class="surface reveal-mask" x="80" y="30" width="400" height="180"/><path class="warm reveal-edge" d="M82 30V210"/></g><text x="280" y="230" text-anchor="middle">Uma vez na entrada → interface legível</text>')},
{name:'Dar material aos cards',place:'03 · Privacidade dos modelos',title:'Três cards com uma presença física',description:'Cada card ganha uma superfície escura, textura fina e borda com iluminação. Os títulos e as explicações continuam sempre legíveis sobre a arte.',motion:'O reflexo acompanha suavemente o cursor dentro do card. O acabamento visual pode ser compartilhado entre os três, preservando a leitura das diferenças na copy.',purpose:'Tornar a seção de privacidade mais atraente sem usar animação como uma suposta prova de proteção.',svg:wrap([['Anon',55,0],['ZDR',220,1],['E2EE',385,2]].map(([label,x,i])=>'<rect class="surface" x="'+x+'" y="38" width="120" height="162" rx="8"/><path class="line" d="M'+(x+12)+' 52V145M'+(x+24)+' 52V145M'+(x+36)+' 52V145M'+(x+48)+' 52V145M'+(x+60)+' 52V145M'+(x+72)+' 52V145M'+(x+84)+' 52V145M'+(x+96)+' 52V145"/><path class="warm material-line '+(i===1?'delay':i===2?'delay2':'')+'" d="M'+(x+12)+' 58H'+(x+108)+'"/><text class="strong" x="'+(x+60)+'" y="179" text-anchor="middle">'+label+'</text>').join(''))},
{name:'Galeria em profundidade',place:'04 · Variedade / exemplos de uso',title:'Resultados com espaço e profundidade',description:'Três recortes de tarefas — escrita, código e pesquisa — aparecem em planos diferentes. Cada um pode mostrar uma saída real da PPQ, cuidadosamente selecionada.',motion:'Parallax discreto no mouse. Ao escolher uma tarefa, o exemplo correspondente vem para a frente e os demais recuam.',purpose:'Mostrar a variedade com exemplos concretos e uma apresentação mais editorial.',svg:wrap('<g class="float-one"><rect class="surface" x="30" y="71" width="170" height="125" rx="6"/><text x="46" y="94">Writing</text>'+skeleton(46,113,129)+skeleton(46,126,115)+skeleton(46,139,121)+'</g><g class="float-three"><rect class="surface" x="360" y="61" width="170" height="125" rx="6"/><text x="376" y="84">Research</text>'+skeleton(376,103,129)+skeleton(376,116,115)+skeleton(376,129,121)+'</g><g class="float-two"><rect class="surface" x="179" y="32" width="202" height="171" rx="7"/><text class="strong" x="199" y="61">Coding</text><path class="warm" d="M200 87L210 95L200 103M223 108H244"/>'+skeleton(199,132,142)+skeleton(199,145,120)+skeleton(199,158,134)+'</g>')},
{name:'Conectar a verificação',place:'02 · Enclave / Built to be checked',title:'Uma sequência visual de evidências',description:'Código publicado, build reproduzível e ferramentas de verificação aparecem como três peças conectadas. Cada peça pode acompanhar seu link real.',motion:'Uma faixa de luz percorre os três passos conforme a seção entra na tela. O movimento explica a sequência, sem exibir selos ou resultados fictícios.',purpose:'Dar destaque visual ao “privacy you can verify” e incentivar a exploração das evidências.',svg:wrap('<path class="line" d="M65 116H495"/>'+[['CODE',45],['BUILD',225],['VERIFY',405]].map(([label,x])=>'<rect class="surface" x="'+x+'" y="63" width="110" height="106" rx="6"/><rect class="line" x="'+(x+35)+'" y="83" width="40" height="34" rx="3"/><text class="strong" x="'+(x+55)+'" y="147" text-anchor="middle">'+label+'</text>').join('')+'<rect class="fill-warm verify-beam" x="59" y="55" width="2" height="124"/><text x="280" y="211" text-anchor="middle">Código → build → ferramentas de verificação</text>')},
{name:'Acender rotas da API',place:'06 · API / integrações',title:'A conexão responde à escolha da pessoa',description:'PPQ ocupa o centro de uma pequena rede. Ao selecionar um tipo de ferramenta, apenas a rota correspondente ganha luz e aparece um exemplo de uso.',motion:'Um pulso percorre o caminho até o app selecionado. O hover pode antecipar o destaque; clique e toque selecionam a demonstração.',purpose:'Explicar que a mesma plataforma pode servir a ferramentas diferentes, com um único saldo.',svg:wrap('<path class="line" d="M155 120H280V62H400M280 120H400M280 120V178H400"/><rect class="surface" x="45" y="85" width="110" height="70" rx="8"/><text class="strong" x="100" y="126" text-anchor="middle">PPQ</text>'+[['Code',42],['Research',100],['Automation',158]].map(([label,y])=>'<rect class="surface" x="400" y="'+y+'" width="125" height="40" rx="5"/><text x="462" y="'+(y+25)+'" text-anchor="middle">'+label+'</text>').join('')+'<circle class="fill-warm packet-a" cx="280" cy="120" r="4"/><circle class="fill-warm packet-b" cx="280" cy="120" r="4"/><circle class="fill-warm packet-c" cx="280" cy="120" r="4"/><text x="100" y="182" text-anchor="middle">One balance</text>')},
{name:'Representar uso pontual',place:'05 · Pagamento por uso',title:'A atividade acende quando há uma tarefa',description:'Pequenos módulos ficam em repouso. Uma solicitação ativa um deles por alguns segundos, e depois ele volta a descansar.',motion:'Uma sequência curta de acender → processar → concluir, iniciada pela escolha de uma tarefa. Valores de cobrança só entram se vierem de exemplos reais.',purpose:'Dar uma forma visual à ideia de uso sob demanda, sem sugerir economias ou preços inventados.',svg:wrap([['Write',55,0],['Code',220,1],['Research',385,2]].map(([label,x,i])=>'<rect class="surface" x="'+x+'" y="58" width="120" height="120" rx="7"/><g class="job-light '+(i===1?'second':i===2?'third':'')+'"><rect class="warm" x="'+x+'" y="58" width="120" height="120" rx="7"/><circle class="fill-warm" cx="'+(x+60)+'" cy="99" r="8"/></g><circle class="line" cx="'+(x+60)+'" cy="99" r="15"/><text x="'+(x+60)+'" y="151" text-anchor="middle">'+label+'</text>').join('')+'<text x="280" y="213" text-anchor="middle">Atividade ligada à tarefa</text>')},
{name:'Costurar as seções',place:'Transição · Hero → enclave',title:'Uma passagem de luz entre capítulos',description:'Uma faixa estreita atravessa a largura da página. Duas superfícies escuras se deslocam um pouco, criando uma abertura visual para a seção seguinte.',motion:'A luz cruza uma vez quando a transição entra na tela. O scroll continua natural e o texto seguinte permanece disponível.',purpose:'Dar ritmo à leitura e conectar a apresentação do produto ao principal diferencial.',svg:wrap('<rect class="surface" x="30" y="20" width="500" height="80" rx="5"/><text x="55" y="48">HERO / PRODUCT</text>'+skeleton(55,64,200)+'<rect class="surface" x="30" y="140" width="500" height="80" rx="5"/><text class="strong" x="55" y="175">Your chat traffic stays unreadable to us.</text>'+skeleton(55,194,290)+'<path class="line" d="M30 120H530"/><path class="warm seam-light" d="M30 120H150"/>')},
{name:'Animar a assinatura PPQ',place:'08 · Fechamento / marca',title:'Um encerramento que fica na memória',description:'Uma versão grande da marca ganha um tratamento de luz, relevo ou linhas que se organizam. Ela ocupa o espaço acima ou ao lado do CTA final.',motion:'O contorno se forma e recebe um reflexo, depois permanece estável. O botão e o texto de fechamento já estão visíveis durante a entrada.',purpose:'Criar uma assinatura visual reutilizável em outras páginas e materiais da PPQ.',svg:wrap('<text x="280" y="157" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:133px;font-weight:800;letter-spacing:-10px;fill:var(--line)">PPQ</text><text class="brand-fill" x="280" y="157" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:133px;font-weight:800;letter-spacing:-10px;fill:var(--ink)">PPQ</text><path class="warm brand-outline" d="M154 166V65H212Q250 65 250 100Q250 132 212 132H181M274 166V65H332Q370 65 370 100Q370 132 332 132H301"/><rect class="pill" x="226" y="196" width="108" height="28" rx="4"/><text x="280" y="214" text-anchor="middle">Start chatting</text>')}
];
const buttons=options.map((option,index)=>{
 const button=document.createElement('button');button.className='option';button.id='option-'+index;button.role='tab';button.setAttribute('aria-controls','study');button.dataset.index=index;button.innerHTML='<small>0'+(index+1)+'</small>'+option.name;button.addEventListener('click',()=>select(index));document.getElementById('options').appendChild(button);return button;
});
function select(index){
 const option=options[index];buttons.forEach((button,i)=>{button.setAttribute('aria-selected',String(i===index));button.tabIndex=i===index?0:-1});
 document.getElementById('study').setAttribute('aria-labelledby','option-'+index);
 for(const key of ['place','title','description','motion','purpose'])document.getElementById(key).textContent=option[key];
 document.getElementById('scene').innerHTML=option.svg;
}
buttons.forEach((button,index)=>button.addEventListener('keydown',event=>{let next=index;if(event.key==='ArrowRight')next=(index+1)%buttons.length;else if(event.key==='ArrowLeft')next=(index+buttons.length-1)%buttons.length;else if(event.key==='Home')next=0;else if(event.key==='End')next=buttons.length-1;else return;event.preventDefault();select(next);buttons[next].focus()}));
const pause=document.getElementById('pause');pause.addEventListener('click',()=>{document.getElementById('study').classList.toggle('paused');pause.textContent=document.getElementById('study').classList.contains('paused')?'Reproduzir esboço':'Pausar esboço'});
if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){pause.disabled=true;pause.textContent='Movimento reduzido'}
select(4);
</script></body></html>
